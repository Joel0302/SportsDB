name: Master-Script-Workflow
on:
  push:
    branches:
      - 'QA'
  pull_request:
    branches:
      - 'QA'

jobs:
  Create-Final-Master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Master Script
        run: |
          RELEASE_DIR="RELEASE_SCRIPTS"
          SPRINT_FOLDER="${{ vars.SPRINT_NAME }}"
          TARGET_DIR="$RELEASE_DIR/$SPRINT_FOLDER"
          mkdir -p "$TARGET_DIR"

          # 1. Identify Changes
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_REF="origin/${{ github.base_ref }}...HEAD"
          else
            DIFF_REF="HEAD^ HEAD"
          fi

          CHANGED_FILES=$(git diff --name-only $DIFF_REF -- \
            'DBO_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'BI_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'STG_WINGSPAN_ANALYTICS/TABLES/*.sql' \
            'CERTIFIED_BUSINESS_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'CI_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'MPARTICLE_WINGSPAN_INTEGRATION/VIEWS/*.sql' \
            "$TARGET_DIR/Adhoc_Scripts*.sql" \
            "$TARGET_DIR/Grants.sql" || true)

          # 2. Categorize and Sort
          # sort ensures Adhoc_Scripts.sql is processed before Adhoc_Scripts_part02.sql
          ADHOC_LIST=$(echo "$CHANGED_FILES" | grep "Adhoc_Scripts" | sort || true)
          OTHER_CHANGES=$(echo "$CHANGED_FILES" | grep -vE "Adhoc_Scripts|Grants.sql" || true)
          HAS_GRANTS=$(echo "$CHANGED_FILES" | grep -q "Grants.sql" && echo "true" || echo "false")

          # 3. Versioning Setup
          EXISTING_COUNT=$(ls "$TARGET_DIR"/DDL_Scripts_2026-W04_V*.sql 2>/dev/null | wc -l)
          NEXT_VAL=$((EXISTING_COUNT + 1))

          # 4. Generate Scripts
          LOOP_COUNT=0
          if [ -n "$ADHOC_LIST" ]; then
            for adhoc_file in $ADHOC_LIST; do
              # CRITICAL FIX: Check if the file exists before processing
              if [ ! -f "$adhoc_file" ]; then
                echo "Skipping $adhoc_file: File does not exist (it may have been deleted or moved)."
                continue
              fi
              CURRENT_V=$((NEXT_VAL + LOOP_COUNT))
              MASTER_PATH="$TARGET_DIR/DDL_Scripts_2026-W04_V${CURRENT_V}.sql"
              
              # Add the Adhoc content
              echo -e "-- SECTION: ADHOC --\n-- Source: $adhoc_file --" >> "$MASTER_PATH"
              cat "$adhoc_file" >> "$MASTER_PATH"

              # Only for the very first file in the loop, bundle other changes and grants
              if [ $LOOP_COUNT -eq 0 ]; then
                if [ -n "$OTHER_CHANGES" ]; then
                  echo -e "\n-- SECTION: FOLDER CHANGES --" >> "$MASTER_PATH"
                  for file in $OTHER_CHANGES; do 
                    if [ -f "$file" ]; then
                        echo -e "-- Source: $file --" >> "$MASTER_PATH"
                        cat "$file" >> "$MASTER_PATH"
                        echo -e "\n" >> "$MASTER_PATH"
                    fi
                  done
                fi
                if [ "$HAS_GRANTS" == "true" ]; then
                  echo -e "\n-- SECTION: GRANTS --" >> "$MASTER_PATH"
                  cat "$TARGET_DIR/Grants.sql" >> "$MASTER_PATH"
                fi
              fi
              LOOP_COUNT=$((LOOP_COUNT + 1))
            done
          else
            # Fallback: If no Adhoc scripts changed, put folder/grants in one script
            if [ -n "$OTHER_CHANGES" ] || [ "$HAS_GRANTS" == "true" ]; then
              MASTER_PATH="$TARGET_DIR/DDL_Scripts_2026-W04_V${NEXT_VAL}.sql"
              # Add Folder Changes with spacing
              for f in $OTHER_CHANGES; do 
                if [ -f "$f" ]; then
                  echo -e "-- Source: $f --" >> "$MASTER_PATH"
                  cat "$f" >> "$MASTER_PATH"
                  echo -e "\n\n" >> "$MASTER_PATH"
                fi
              done
              # Add Grants with spacing
              if [ "$HAS_GRANTS" == "true" ] && [ -f "$TARGET_DIR/Grants.sql" ]; then
                echo -e "-- SECTION: GRANTS --" >> "$MASTER_PATH"
                cat "$TARGET_DIR/Grants.sql" >> "$MASTER_PATH"
                echo -e "\n" >> "$MASTER_PATH"
              fi
            else
             echo "No relevant SQL file changes detected. Skipping script generation."
            fi
          fi

      - name: Push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-generated consolidated DDL phase scripts [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}






