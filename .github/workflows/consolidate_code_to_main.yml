name: Master-Script-Workflow
on:
  push:
    branches:
      - 'QA'
  pull_request:
    branches:
      - 'QA'

jobs:
  Create-Final-Master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Master Script
        run: |
          RELEASE_DIR="RELEASE_SCRIPTS"
          SPRINT_FOLDER="${{ vars.SPRINT_NAME }}"
          TARGET_DIR="$RELEASE_DIR/$SPRINT_FOLDER"
          mkdir -p "$TARGET_DIR"

          # 1. Identify ALL relevant changes in one go
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_REF="origin/${{ github.base_ref }}...HEAD"
          else
            DIFF_REF="HEAD^ HEAD"
          fi

          # Capture changes for folders AND specific files
          CHANGED_FILES=$(git diff --name-only $DIFF_REF -- \
            'DBO_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'BI_WINGSPAN_ANALYTICS/*.sql' \
            'STG_WINGSPAN_ANALYTICS/*.sql' \
            'CERTIFIED_BUSINESS_WINGSPAN_ANALYTICS/*.sql' \
            "$TARGET_DIR/Adhoc_Scripts.sql" \
            "$TARGET_DIR/Grants.sql" || true)

          # 2. Proceed ONLY if there is at least one relevant change
          if [ -n "$CHANGED_FILES" ]; then
            # Versioning logic: Count existing P files to determine the next number
            EXISTING_COUNT=$(ls "$TARGET_DIR"/DDL_CONSOLIDATED_P*.sql 2>/dev/null | wc -l)
            NEXT_VAL=$((EXISTING_COUNT + 1))
            MASTER_PATH="$TARGET_DIR/DDL_CONSOLIDATED_P${NEXT_VAL}.sql"

            # A. ALWAYS TRY ADHOC FIRST (but only if it actually changed)
            if echo "$CHANGED_FILES" | grep -q "Adhoc_Scripts.sql"; then
               echo -e "\n-- SECTION: ADHOC SCRIPTS --" >> "$MASTER_PATH"
               cat "$TARGET_DIR/Adhoc_Scripts.sql" >> "$MASTER_PATH"
               echo -e "\n" >> "$MASTER_PATH"
            fi

            # B. ADD FOLDER/FILE CHANGES (Views, BI, STG, etc.)
            echo -e "\n-- SECTION: FOLDER/FILE CHANGES --" >> "$MASTER_PATH"
            for file in $CHANGED_FILES; do
              # Skip Adhoc and Grants in this loop so they don't repeat
              if [[ "$file" == *"Adhoc_Scripts.sql" ]] || [[ "$file" == *"Grants.sql" ]]; then
                continue
              fi
              if [ -f "$file" ]; then
                echo -e "-- Source: $file --" >> "$MASTER_PATH"
                cat "$file" >> "$MASTER_PATH"
                echo -e "\n" >> "$MASTER_PATH"
              fi
            done

            # C. ALWAYS TRY GRANTS LAST (but only if it actually changed)
            if echo "$CHANGED_FILES" | grep -q "Grants.sql"; then
               echo -e "\n-- SECTION: GRANTS (UPDATED) --" >> "$MASTER_PATH"
               cat "$TARGET_DIR/Grants.sql" >> "$MASTER_PATH"
               echo -e "\n" >> "$MASTER_PATH"
            fi
          else
            echo "No relevant changes detected in DDL, Adhoc, or Grants. Skipping script generation."
          fi

      - name: Push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # The commit message now includes the specific P# file created
          git commit -m "Auto-generated consolidated DDL phase script [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}


