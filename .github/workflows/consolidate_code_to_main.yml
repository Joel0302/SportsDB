name: Master-Script-Workflow
on:
  push:
    branches:
      - 'QA'
  pull_request:
    branches:
      - 'QA' 

jobs:
  Create-Final-Master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Differences from main
        id: check_diff
        run: |
          # Fetch main so we have a reference point
          git fetch origin main
          
          # Check if any SQL files are different between main and this new branch
          # Replace the paths below with your actual folder names
          DIFF=$(git diff --name-only origin/main...HEAD || true)

          if [ -z "$DIFF" ]; then
            echo "No new SQL changes compared to master. This is likely a new branch creation."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New SQL changes detected. Proceeding..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi  

      - name: Generate Master Script
        if: steps.check_diff.outputs.skip != 'true'
        run: |
          RELEASE_DIR="RELEASE_SCRIPTS"
          SPRINT_FOLDER="${{ vars.SPRINT_NAME }}"
          TARGET_DIR="$RELEASE_DIR/$SPRINT_FOLDER"
          mkdir -p "$TARGET_DIR"

          # Identify all relevant changes in one go
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF_REF="origin/${{ github.base_ref }}...HEAD"
          else
            DIFF_REF="HEAD^ HEAD"
          fi
          
          # Capture changes for folders and specific files   
          CHANGED_FILES=$(git diff --name-only $DIFF_REF -- \
            'DBO_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'BI_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'STG_WINGSPAN_ANALYTICS/TABLES/*.sql' \
            'CERTIFIED_BUSINESS_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'CI_WINGSPAN_ANALYTICS/VIEWS/*.sql' \
            'MPARTICLE_WINGSPAN_INTEGRATION/VIEWS/*.sql' \
            "$TARGET_DIR/DDL_V*/Adhoc_Scripts*.sql" \
            "$TARGET_DIR/DDL_V*/Grants.sql" || true)

          #Categorize and Sort
          ADHOC_LIST=$(echo "$CHANGED_FILES" | grep "Adhoc_Scripts" | sort -V || true)
        
          STG_ONLY=$(echo "$CHANGED_FILES" | grep "STG_WINGSPAN_ANALYTICS" || true)
          
          DBO_ONLY=$(echo "$CHANGED_FILES" | grep "DBO_WINGSPAN_ANALYTICS/VIEWS" || true)
          
          #Extract everything else EXCEPT Adhoc, Grants, and the STG folder we already caught
          REST=$(echo "$CHANGED_FILES" | grep -vE "Adhoc_Scripts|Grants.sql|STG_WINGSPAN_ANALYTICS|DBO_WINGSPAN_ANALYTICS/VIEWS" || true)
          
          #Combining STG -> DBO -> REST
          OTHER_CHANGES=$(echo -e "$STG_ONLY\n$DBO_ONLY\n$REST" | sed '/^$/d' || true)

          HAS_GRANTS=$(echo "$CHANGED_FILES" | grep -q "Grants.sql" && echo "true" || echo "false")

          if [ -n "$CHANGED_FILES" ]; then
            
            #Identify active version folder default to DDL_V1 if only outer files changed
            ACTIVE_V_FOLDER=$(echo "$CHANGED_FILES" | grep -o "DDL_V[0-9]\+" | head -n 1)
            [ -z "$ACTIVE_V_FOLDER" ] && ACTIVE_V_FOLDER="DDL_V1"

            VERSION_PATH="$TARGET_DIR/$ACTIVE_V_FOLDER"
            mkdir -p "$VERSION_PATH"
            MASTER_PATH="$VERSION_PATH/DDL_Consolidated_Script.sql"

            # Reset file with header
            echo "-- Consolidated Script for $ACTIVE_V_FOLDER --" > "$MASTER_PATH"

            # 2. ADHOC SCRIPTS (First)
            if [ -f "$VERSION_PATH/Adhoc_Scripts.sql" ]; then
                echo -e "\n-- SECTION: ADHOC SCRIPTS --" >> "$MASTER_PATH"
                cat "$VERSION_PATH/Adhoc_Scripts.sql" >> "$MASTER_PATH"
                echo -e "\n" >> "$MASTER_PATH"
            fi

            # 3. OUTER FOLDER CHANGES (STG -> DBO -> REST) - V1 ONLY
            if [ "$ACTIVE_V_FOLDER" == "DDL_V1" ] && [ -n "$OTHER_CHANGES" ]; then
                echo -e "\n-- SECTION: SCHEMA CHANGES (STG -> DBO -> REST) --" >> "$MASTER_PATH"
                while IFS= read -r file; do
                  # Ensure we only cat files that exist and are NOT the adhoc/grants in the subfolder
                  if [ -f "$file" ] && [[ "$file" != *"$ACTIVE_V_FOLDER"* ]]; then
                    echo "-- Source: $file --" >> "$MASTER_PATH"
                    cat "$file" >> "$MASTER_PATH"
                    echo -e "\n" >> "$MASTER_PATH"
                  fi
                done <<< "$OTHER_CHANGES"
            fi

            # 4. GRANTS (Last)
            if [ -f "$VERSION_PATH/Grants.sql" ]; then
                echo -e "\n-- SECTION: GRANTS --" >> "$MASTER_PATH"
                cat "$VERSION_PATH/Grants.sql" >> "$MASTER_PATH"
                echo -e "\n" >> "$MASTER_PATH"
            fi
            
            echo "ACTIVE_FOLDER=$ACTIVE_V_FOLDER" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # The commit message now includes the specific V# file created
          git commit -m "Auto-generated consolidated DDL phase script [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
